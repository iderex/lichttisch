[package]
name = "corpus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Nothing. The corpus has to come out the same on a second machine, and every
# dependency is a thing that can change what it produces without this tree
# saying so.
[dependencies]

# Take the lint set from the workspace root (#15). A member without these two
# lines is linted at the default levels and is quietly outside the set.
[lints]
workspace = true
